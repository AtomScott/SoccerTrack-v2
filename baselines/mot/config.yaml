# MOT baseline config — edit paths, leave structure.
#
# Pipeline (see baselines/mot/train.py): MOT->YOLO dataset -> fine-tune YOLOv8-s
# -> ByteTrack on test halves -> MOTChallenge-format predictions under
# eval.pred_root/<tracker>/data/<seq>.txt, scored by baselines/mot/eval.py.
#
# MOT is the *tracking-only* subset of GSR: train.py reuses the dataset/detector/
# tracker stages from baselines.gsr.train and adds only the MOTChallenge writer.
# Hence this config mirrors baselines/gsr/config.yaml for the shared stages but
# drops the GSR-only reid / homography / pitch sections (MOT is pure image-plane).

data:
  root: ./data                          # SoccerTrack v2 snapshot root (has mot/, interim/, ...)
  train_matches: [117091, 117092, 117093, 117094, 117095, 117096, 117097]  # bare match ids
  val_matches:   [117098]                                                   # bare match ids
  # test_matches are TrackEval SEQUENCE NAMES (one per half), not bare match ids:
  # baselines/mot/eval.py passes these straight to TrackEval to pair
  #   <pred_root>/<tracker>/data/<seq>.txt  against  <data.root>/mot/<seq>/gt/gt.txt
  # (the native MOTChallenge trackers/<tracker>/data/<seq>.txt layout; the
  # evaluator src.evaluation.mot_hota sets SKIP_SPLIT_FOL=True so neither side is
  # nested under a MOT17-custom split folder). train.py's parse_test_sequence()
  # recovers (match_id, half) from each name.
  # docs/format-mot.md: score each half as its own sequence with a distinct name.
  test_matches:  [117099_1st, 117099_2nd, 117100_1st, 117100_2nd]

# Per-match MOT ground-truth annotations used to BUILD the YOLO detection dataset
# (train/val matches only). build_yolo_dataset (reused from gsr.train) resolves
#   <mot.root>/<match>/<filename_template>   with {match}, {half}={1st_half,2nd_half}
#
# !! GROUND-TRUTH PATH CONVENTIONS — read before laying out data/mot !!
# This tree must satisfy TWO physically different GT path shapes (build vs scoring),
# and the half token is spelled differently in each. A released data/mot must
# contain both. The train/val matches (117091-117098) and test matches
# (117099-117100) are DISJOINT, so the two shapes never collide on one file, but
# every match folder still has to follow whichever shape its role demands.
#
# 1) BUILD (this section; train/val matches; half = '1st_half' / '2nd_half'):
#      <mot.root>/<match>/<half>/gt/gt.txt
#      e.g. data/mot/117091/1st_half/gt/gt.txt
#    Driven by mot.filename_template below and the {half} values in gsr.train.
#
# 2) SCORING (test matches; per-half SEQUENCE name, half token = '1st' / '2nd'):
#    The evaluator src.evaluation.mot_hota sets SKIP_SPLIT_FOL=True, so TrackEval
#    reads GT at the un-nested, sequence-named path:
#      <data.root>/mot/<match>_<half>/gt/gt.txt   (+ a seqinfo.ini per sequence)
#      e.g. data/mot/117099_1st/gt/gt.txt  and  data/mot/117099_1st/seqinfo.ini
#    (Historical note: with TrackEval's default SKIP_SPLIT_FOL=False it would
#    instead nest under data/mot/MOT17-custom/117099_1st/gt/gt.txt — that nesting
#    is the bug this evaluator now suppresses; do NOT lay out a MOT17-custom dir.)
#
# Note the half-suffix mismatch: BUILD uses '1st_half'/'2nd_half' (a sub-dir),
# SCORING uses '1st'/'2nd' folded into the sequence-name dir '<match>_1st'.
mot:
  root: ./data/mot
  filename_template: "{half}/gt/gt.txt"

# Source panoramic video per half. Must be the CALIBRATED (undistorted) panorama,
# matching the repo's naming (docs/data_processing.md,
# scripts/convert_coordinates_to_bboxes.sh):
#   data/interim/<match>/<match>_calibrated_panorama_<half>.mp4
# video_path() (reused from gsr.train) resolves
#   <video.root>/<match>/<filename_template>   with {match}, {half}={1st_half,2nd_half}.
video:
  root: ./data/interim
  filename_template: "{match}_calibrated_panorama_{half}.mp4"

detector:
  name: yolov8s
  base_weights: yolov8s.pt               # ultralytics base checkpoint to fine-tune from
  weights: null                          # set to fine-tuned weights to skip training,
                                         # e.g. ./outputs/mot_baseline/detector/yolov8s_mot/weights/best.pt
  conf_thresh: 0.35
  iou_thresh: 0.55
  imgsz: 1280
  epochs: 50
  batch: 8
  project: ./outputs/mot_baseline/detector
  run_name: yolov8s_mot
  dataset_dir: ./outputs/mot_baseline/yolo_dataset
  dataset:
    frame_interval: 5                    # sample every Nth frame when building the YOLO dataset
    splits: { train: 0.8, val: 0.1, test: 0.1 }
    frame_width: null                    # null -> keep native resolution
    frame_height: null

tracker:
  name: bytetrack                        # ultralytics ships bytetrack.yaml / botsort.yaml
  config: bytetrack.yaml                 # path or name of the ultralytics tracker config
  match_thresh: 0.8                      # (documented for reference; tune via a custom tracker yaml)
  track_buffer: 30

eval:
  metrics: [HOTA, IDF1, MOTA]            # src.evaluation.mot_hota via TrackEval
  pred_root: ./outputs/mot_baseline/preds  # MOTChallenge preds: <tracker>/data/<seq>.txt
  out: ./outputs/mot_baseline/scores.json
