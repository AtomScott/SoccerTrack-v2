# GSR baseline config — edit paths, leave structure.
data:
  root: ./data                         # SoccerTrack v2 snapshot root
  train_matches: [117092, 117093, 118575, 118576, 118577, 128058, 132877]
  val_matches:   [118578]
  test_matches:  [128057, 132831]      # held out; matches the SoccerTrack Challenge 2025 test split

detector:
  name: yolov8s
  weights: null                        # set to a path to fine-tuned weights
  conf_thresh: 0.35
  iou_thresh: 0.55
  imgsz: 1280

tracker:
  name: bytetrack
  match_thresh: 0.8
  track_buffer: 30

reid:
  name: clip-reid
  weights: null

homography:
  source: per_match_mapxy              # use raw/<match>/<match>_mapx.npy + mapy.npy

eval:
  metric: gs-hota                      # via src.evaluation.gs_hota
  out: ./outputs/gsr_baseline/scores.json
